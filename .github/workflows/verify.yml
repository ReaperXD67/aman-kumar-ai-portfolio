name: Verify portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production artifacts
        run: npm run build

      - name: Verify Sites handoff
        run: npm run test:sites

      - name: Verify profile assets and canonical resume
        run: npm run test:profile

      - name: Set up Python for PDF structural checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-resume-qa.txt

      - name: Verify selectable, photo-free resume structure
        run: |
          python -m pip install -r scripts/requirements-resume-qa.txt
          python scripts/verify-resume.py
